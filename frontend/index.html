<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Campus Canteen - Order delicious food from your college canteen" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Campus Canteen" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#f97316" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />

    <!-- Splash screen color -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <title>Campus Canteen - College Food Ordering</title>

    <style>
      /* PWA Splash / Loading Screen */
      #pwa-splash {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #f97316, #ef4444);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      #pwa-splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #pwa-splash .logo { font-size: 80px; animation: bounce 1s infinite; }
      #pwa-splash .title { color: white; font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 800; margin-top: 16px; }
      #pwa-splash .subtitle { color: rgba(255,255,255,0.8); font-family: 'Inter', sans-serif; font-size: 14px; margin-top: 8px; }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }
    </style>
  </head>
  <body>
    <!-- PWA Splash Screen -->
    <div id="pwa-splash">
      <div class="logo">🍽️</div>
      <div class="title">Campus Canteen</div>
      <div class="subtitle">Order food from your college canteen</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register Service Worker -->
    <script>
      // Hide splash screen when app loads
      window.addEventListener('load', () => {
        const splash = document.getElementById('pwa-splash');
        setTimeout(() => {
          splash.classList.add('hide');
          setTimeout(() => splash.remove(), 500);
        }, 1000);
      });

      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('✅ SW registered:', reg.scope))
            .catch((err) => console.log('❌ SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
